name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Add GitHub Packages token
        run: echo "gitHubToken=${{ secrets.GH_PACKAGES_TOKEN }}" > user.properties

      - name: Build
        run: ./gradlew :app:assembleStandardDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-debug-apk
          path: app/build/outputs/apk/**/*.apk
          
